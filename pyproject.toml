[project]
name = "resy-rank"
version = "0.1.0"
description = "Read-only CLI that scans Resy availability and ranks bookable options by a composite quality score."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "rapidfuzz>=3.6",
]

[project.scripts]
resy-rank = "resy_rank.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resy_rank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
